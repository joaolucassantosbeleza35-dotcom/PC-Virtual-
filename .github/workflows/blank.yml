<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PC Gamer Virtual</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0b1020;
    color:white;
    min-height:100vh;
}

header{
    background:#111a33;
    padding:20px;
    text-align:center;
    border-bottom:2px solid #2878ff;
}

header h1{
    margin:0;
    font-size:25px;
}

.container{
    max-width:700px;
    margin:auto;
    padding:20px;
}

.card{
    background:#151e36;
    border-radius:15px;
    padding:20px;
    margin-bottom:18px;
    border:1px solid #28385f;
}

.card h2{
    margin-top:0;
    color:#5fa0ff;
}

.spec{
    display:flex;
    justify-content:space-between;
    padding:13px 0;
    border-bottom:1px solid #293653;
}

.spec:last-child{
    border-bottom:0;
}

input{
    width:100%;
    padding:14px;
    border-radius:8px;
    border:1px solid #435276;
    background:#080d1a;
    color:white;
    font-size:16px;
    margin:8px 0;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:8px;
    background:#2878ff;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
}

button:active{
    transform:scale(.98);
}

.status{
    background:#06351e;
    color:#62f5a0;
    padding:12px;
    border-radius:8px;
}

#resultado{
    margin-top:15px;
    padding:12px;
    border-radius:8px;
    background:#202c49;
    display:none;
}

.game{
    background:#0d1427;
    padding:13px;
    border-radius:8px;
    margin:8px 0;
}

footer{
    text-align:center;
    padding:20px;
    color:#7d8aa8;
}
</style>
</head>

<body>

<header>
    <h1>🎮 PC GAMER VIRTUAL</h1>
    <p>Windows + Tailscale + Windows App</p>
</header>

<div class="container">

<div class="card">

<h2>🖥️ BUILD DO PC</h2>

<div class="spec">
    <span>Processador</span>
    <b>Ryzen 5 5600</b>
</div>

<div class="spec">
    <span>Placa de vídeo</span>
    <b>RX 6600 8GB</b>
</div>

<div class="spec">
    <span>Memória RAM</span>
    <b>16GB DDR4</b>
</div>

<div class="spec">
    <span>Armazenamento</span>
    <b>SSD NVMe 500GB</b>
</div>

<div class="spec">
    <span>Sistema</span>
    <b>Windows 11 Pro</b>
</div>

</div>

<div class="card">

<h2>🟢 CONEXÃO</h2>

<div class="status">
    ● Sistema pronto para conexão
</div>

<input
    id="ip"
    type="text"
    placeholder="Digite o IP Tailscale"
>

<button onclick="conectar()">
    🔗 CONECTAR
</button>

<div id="resultado"></div>

</div>

<div class="card">

<h2>🎮 JOGOS</h2>

<div class="game">🎮 GTA V</div>
<div class="game">🎮 Fortnite</div>
<div class="game">🎮 Minecraft</div>
<div class="game">🎮 Valorant</div>
<div class="game">🎮 Forza Horizon</div>

</div>

<div class="card">

<h2>📊 STATUS DO PC</h2>

<div class="spec">
    <span>CPU</span>
    <b id="cpu">Normal</b>
</div>

<div class="spec">
    <span>GPU</span>
    <b id="gpu">RX 6600</b>
</div>

<div class="spec">
    <span>RAM</span>
    <b>16GB</b>
</div>

<div class="spec">
    <span>Internet</span>
    <b id="internet">Conectado</b>
</div>

</div>

</div>

<footer>
PC Gamer Virtual
</footer>

<script>

function conectar(){

    const ip=document.getElementById("ip").value.trim();
    const resultado=document.getElementById("resultado");

    resultado.style.display="block";

    if(ip===""){
        resultado.innerHTML="❌ Digite o IP Tailscale.";
        return;
    }

    resultado.innerHTML=
        "✅ PC encontrado!<br><br>"+
        "IP: <b>"+ip+"</b><br>"+
        "Status: <b>Pronto para conexão</b><br><br>"+
        "Abra o Windows App e use este IP para acessar o PC.";
}

setInterval(function(){

    const cpu=Math.floor(Math.random()*20)+20;

    document.getElementById("cpu").innerText=
        cpu+"% de uso";

},2000);

</script>

</body>
</html>enter file contents here
